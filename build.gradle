plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = project.group
version = project.version

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases"
    }
}

sourceSets {
    main {
        java.srcDirs = ['common/src/main/java', 'fabric/src/main/java']
        resources.srcDirs = ['common/src/main/resources', 'fabric/src/main/resources']
        java {
            exclude 'xyz/immortius/museumcurator/client/screens/MuseumCuratorConfigScreen.java'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "com.terraformersmc:modmenu:${modmenu_version}"
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
}

def resourceProperties = [
    version: project.version,
    minecraft_version: project.minecraft_version,
    fabric_loader_version: project.fabric_loader_version,
    mod_name: project.mod_name,
    description: project.description,
    mod_author: project.mod_author,
    license: project.license,
    mod_id: project.mod_id,
    modmenu_version: project.modmenu_version
]

processResources {
    inputs.properties(resourceProperties)
    filesMatching("fabric.mod.json") {
        expand(resourceProperties)
    }
    filesMatching("museumcurator.fabric.mixins.json") {
        expand([mod_id: project.mod_id])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '250']
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") { rename { "${it}_${mod_id}" } }
}
